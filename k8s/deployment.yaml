# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapper-gateway
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scrapper-gateway
  template:
    metadata:
      labels:
        app: scrapper-gateway
    spec:
      containers:
      - name: scrapper-gateway
        image: erizo9/scrappergateway:latest
        ports:
        - containerPort: 80
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq-svc"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: "guest"
        - name: RABBITMQ_PASSWORD
          value: "guest"

---
apiVersion: v1
kind: Service
metadata:
  name: scrapper-gateway-svc
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: scrapper-gateway
  type: NodePort

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scrapper-gateway-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scrapper-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
